<style>
/* 관리자 바로가기: 사이트 머리·꼬리 없이 검은 한 화면. 왼쪽 글·버튼, 오른쪽 아래 AX 그림 */
body { background: #000; color: #fff; }
.adm { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
  padding: clamp(40px, 6vh, 76px) clamp(24px, 5.8vw, 112px) clamp(32px, 5vh, 64px); }
.adm-visual { position: absolute; right: 0; bottom: 0; z-index: -1; height: 100%; width: min(54%, calc(100vh * 0.8125)); object-fit: cover; object-position: right bottom;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%); mask-image: linear-gradient(90deg, transparent 0%, #000 22%); }
.adm-logo { display: inline-grid; justify-items: end; gap: 2px; align-self: flex-start; color: #fff; text-decoration: none; }
.adm-logo img { width: 170px; height: auto; display: block; }
.adm-logo span { font-size: 11.5px; font-style: italic; font-weight: 500; letter-spacing: 0.01em; margin-right: 30px; }
.adm-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: clamp(48px, 8vh, 120px); padding: 48px 0; }
.adm h1 { font-size: clamp(38px, 4.1vw, 80px); font-weight: 800; line-height: 1.1; letter-spacing: -0.015em; max-width: 11.5em; text-wrap: balance; }
.adm-links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 40px; }
.adm-card { width: 282px; min-height: 76px; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 16px; padding: 12px 22px;
  border: 1px solid rgba(255, 255, 255, 0.72); color: #fff; text-decoration: none; transition: background-color 180ms var(--ease), border-color 180ms var(--ease); }
.adm-card b { grid-column: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
.adm-card span { grid-column: 1; font-size: 13px; font-weight: 500; line-height: 1.4; }
.adm-card svg { grid-column: 2; grid-row: 1 / span 2; width: 18px; height: 18px; transition: transform 200ms var(--ease); }
.adm-card.vp b { color: #ffe58f; }
.adm-card.fl b { color: #a9d6ff; }
.adm-card:hover { background: rgba(255, 255, 255, 0.07); border-color: #fff; }
.adm-card:hover svg { transform: translateX(4px); }
.adm-card:focus-visible, .adm-logo:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
.adm-copy { font-size: 13.5px; color: rgba(255, 255, 255, 0.82); }
@media (max-width: 560px) {
  .adm-visual { width: 100%; height: 58%; opacity: 0.55; }
  .adm-links { flex-direction: column; gap: 14px; }
  .adm-card { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .adm-visual { animation: fade-in 1600ms var(--ease-out) both; }
  .adm h1 { animation: title-in 1000ms var(--ease-out) 150ms both; }
  .adm-links li { animation: rise 900ms var(--ease-out) both; }
  .adm-links li:nth-child(1) { animation-delay: 420ms; }
  .adm-links li:nth-child(2) { animation-delay: 520ms; }
}
</style>
