<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>홈페이지 관리 | 캠버 CAMVER</title>
<meta name="theme-color" content="#07090c">
<link rel="icon" href="../img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="manage.css">
<!--CONFIG-->
</head>
<body>

<!-- 로그인 -->
<section class="login" id="login" aria-labelledby="login-h">
  <img class="login-bg" src="../img/admin-bg.jpg" alt="" width="1920" height="1280" decoding="async">
  <div class="login-panel">
    <a class="login-logo" href="../admin.html" aria-label="관리자 바로가기로 돌아가기"><img src="../img/camver-ai-logo-white.png" alt="CAMVER.AI" width="462" height="78"></a>
    <div class="login-body">
      <p class="eyebrow" lang="en">HOMEPAGE CONSOLE</p>
      <h1 id="login-h">홈페이지 관리</h1>
      <p class="login-lead">문의 처리 · 입사·제휴 신청 · 소식 · 설정</p>

      <form class="login-form" id="loginForm" novalidate>
        <label class="login-field">
          <span>오늘 처리하는 담당자</span>
          <input name="actor" id="actor" maxlength="20" autocomplete="name" placeholder="이름" required>
        </label>
        <p class="login-hint">같은 계정을 함께 쓰기 때문에 작업 기록에 계정과 이 이름이 같이 남습니다.</p>
        <div class="login-go">
          <div id="gbtn" class="gbtn" aria-live="polite"></div>
          <button class="btn-demo" id="demoGo" type="submit" hidden>데모 화면 들어가기</button>
        </div>
        <p class="login-note" id="loginNote"></p>
        <p class="login-msg" id="loginMsg" role="alert"></p>
      </form>
    </div>
    <p class="login-copy" lang="en">Copyright ⓒ Camver AI. All Rights Reserved.</p>
  </div>
</section>

<!-- 관리 화면 -->
<div class="app" id="app" hidden>
  <aside class="rail" aria-label="관리 메뉴">
    <div class="rail-top">
      <a class="rail-logo" href="#/home" aria-label="한눈에 보기"><img src="../img/camver-ai-logo-white.png" alt="CAMVER.AI" width="462" height="78"></a>
      <span class="rail-tag">홈페이지 관리</span>
    </div>
    <nav class="rail-nav" id="nav">
      <a href="#/home" data-v="home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z"/></svg><span>한눈에 보기</span></a>
      <a href="#/contact" data-v="contact"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v10H8l-4 3v-3H3z"/></svg><span>도입·제휴 문의</span><b class="cnt" data-cnt="contact"></b></a>
      <a href="#/join" data-v="join"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h6l4 4v10H6z"/><path d="M12 3v4h4M9 11h4M9 14h4"/></svg><span>입사 지원·제휴</span><b class="cnt" data-cnt="join"></b></a>
      <a href="#/news" data-v="news"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h11v12H5a2 2 0 0 1-2-2z"/><path d="M14 7h3v7a2 2 0 0 1-2 2M6 7h5M6 10h5M6 13h3"/></svg><span>소식</span></a>
      <a href="#/logs" data-v="logs"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg><span>작업 기록</span></a>
      <a href="#/settings" data-v="settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M17.5 10h-2.2M4.7 10H2.5M15.3 4.7l-1.6 1.6M6.3 13.7l-1.6 1.6M15.3 15.3l-1.6-1.6M6.3 6.3 4.7 4.7"/></svg><span>설정</span></a>
    </nav>
    <div class="rail-foot">
      <div class="who"><b id="whoName"></b><span id="whoMail"></span></div>
      <div class="rail-links">
        <a href="../" target="_blank" rel="noopener">홈페이지 보기</a>
        <button type="button" data-act="logout">로그아웃</button>
      </div>
    </div>
  </aside>

  <main class="work" id="main" tabindex="-1">
    <header class="work-head">
      <div>
        <p class="crumb" lang="en" id="crumb">CAMVER.AI / CONSOLE</p>
        <h1 id="viewTitle"><span class="mark"></span></h1>
      </div>
      <div class="sync">
        <span class="sync-at" id="syncAt"></span>
        <button class="btn ghost" type="button" data-act="reload"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.7h-3.7"/></svg>새로고침</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-dim" data-act="close"></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1" id="drawerPanel"></section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="demo-flag" id="demoFlag" hidden>데모 데이터 · 실제 시트와 연결 안 됨</div>

<script src="manage.js"></script>
</body>
</html>
